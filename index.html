<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أَرْسِل رَسَالَة سَرِيَّة ✨</title>
    <!-- استدعاء خطوط عربية مميزة وأنيقة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --rose-gold: #b37367;
            --rose-gold-dark: #8c5247;
            --rose-light: #fbebe8;
            --pink-soft: #f7dcd5;
            --white-glow: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

     body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* تغيير الخلفية لصورة */
    background-image: url(download\ \(75\).jpg); /* اسم صورة الخلفية */
    background-size: cover;            /* تغطي الشاشة بالكامل */
    background-position: center;       /* تتوسط في النص */
    background-repeat: no-repeat;      /* تمنع تكرار الصورة */
    background-attachment: fixed;      /* تثبيت الخلفية عند السكرول */
    padding: 20px;
}

        /* حاوية التصميم الرئيسية المتدرجة زجاجياً */
       .glass-container {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 30px 20px;
    box-shadow: 0 8px 32px 0 rgba(110, 60, 55, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.4);
    width: 100%;
    max-width: 400px;
    position: relative;
    
    /* التعديل هنا: الإزاحة لليسار */
    margin-left: 15%;
    margin-right: auto;
}

        /* شكل الوردة البينك والروز البرونزي */
        .rose-card {
            background: radial-gradient(circle at center, #ffffff 0%, #fcede9 60%, #e8bebe 100%);
            border-radius: 50% 50% 45% 45% / 40% 40% 50% 50%;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(140, 82, 71, 0.2),
                        inset 0 0 25px rgba(255, 255, 255, 0.9),
                        0 0 0 12px rgba(255, 240, 237, 0.5);
            border: 2px solid rgba(230, 180, 170, 0.6);
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* عنوان أرسل رسالة سرية بخط عريض ولمعة */
        h2 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 32px;
            text-align: center;
            color: #6a3931;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
            position: relative;
        }

        h2::before, h2::after {
            content: "✨";
            font-size: 18px;
            margin: 0 8px;
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #5c352e;
            font-weight: 700;
            font-size: 15px;
            padding-right: 5px;
        }

        /* مدخل الاسم الاختياري */
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--white-glow);
            border: 1.5px solid #e0b6ae;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            color: #4a2822;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input[type="text"]:focus {
            border-color: var(--rose-gold);
            box-shadow: 0 0 10px rgba(179, 115, 103, 0.3);
            background: #ffffff;
        }

        /* تصميم المجلد الناعم اللامع للرسالة */
        .folder-wrapper {
            position: relative;
            background: #fdf5f3;
            border-radius: 16px;
            border: 1.5px solid #deb3aa;
            box-shadow: 0 6px 18px rgba(179, 115, 103, 0.15),
                        inset 0 0 12px rgba(255, 255, 255, 0.8);
            padding: 15px 12px 10px 12px;
            margin-top: 10px;
        }

        /* لسان المجلد (Folder Tab) */
        .folder-tab {
            position: absolute;
            top: -14px;
            right: 15px;
            background: #edd3cc;
            border: 1.5px solid #deb3aa;
            border-bottom: none;
            padding: 2px 18px;
            border-radius: 8px 8px 0 0;
            font-size: 11px;
            color: #704037;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: var(--white-glow);
            border: 1px solid #e2bcb4;
            border-radius: 10px;
            padding: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            color: #4a2822;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--rose-gold);
            background: #ffffff;
            box-shadow: 0 0 8px rgba(179, 115, 103, 0.25);
        }

        /* زر إرسال الرسالة البرونزي الأنيق */
      button {
    width: 75%;                     /* تصغير العرض ليدخل جوه الشكل البيضاوي */
    display: block;
    margin: 15px auto 5px auto;    /* توسيط الزرار في المنتصف */
    padding: 10px 20px;
    background: linear-gradient(90deg, #96615b 0%, #b88a85 50%, #96615b 100%);
    color: #ffffff;
    border: none;
    border-radius: 25px;            /* حواف دائرية/بيضاوية ناعمة */
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(150, 97, 91, 0.35);
    transition: all 0.3s ease;
}

        button:hover {
            background: linear-gradient(135deg, #b86e61 0%, #914d41 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(131, 69, 58, 0.45);
        }

        button:active {
            transform: translateY(0);
        }

        #responseMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            min-height: 22px;
        }
        /* تحسين شكل الكارت للشاشات الصغيرة (الموبايل والتابلت) */
@media (max-width: 600px) {
    body {
        padding: 10px;
        align-items: center; /* يتوسط التصميم عمودياً */
    }

    .glass-container {
        max-width: 95%;      /* ياخد 95% من عرض شاشة الموبايل */
        margin: 0 auto;      /* يتوسط في نص شاشة الموبايل تماماً */
        padding: 20px 15px;  /* تصغير المسافات الداخلية قليلاً */
    }

    .flower-card {
        padding: 25px 15px;  /* ضغط الحجم ليناسب الشاشة الصغيرة */
    }

    .title {
        font-size: 24px;      /* تصغير حجم خط العنوان قليلاً للموبايل */
    }

    button {
        width: 85%;          /* توسيع الزرار قليلاً ليسهل الضغط عليه باللمس */
        font-size: 14px;
    }
}
    </style>
</head>
<body>

<div class="glass-container">
    <div class="rose-card">
        <h2>أرسل رسالة سرية</h2>
        
        <form id="messageForm">
            <div class="input-group">
                <label for="name">الاسم (اختياري)</label>
                <input type="text" id="name" placeholder="اكتب اسمك هنا (لو حابب)...">
            </div>

            <div class="input-group">
                <label for="message">الرسالة</label>
                <div class="folder-wrapper">
                    <div class="folder-tab">رسالة خاصة</div>
                    <textarea id="message" placeholder="اكتب رسالتك السرية هنا..." required></textarea>
                </div>
            </div>

            <button type="submit">إرسال الرسالة ✨</button>
        </form>

        <div id="responseMessage"></div>
    </div>
</div>

<script>
    // رابط السيرفر المربوط بالباك إند
    const API_URL = "http://127.0.0.1:5000/api/send-message";

    document.getElementById('messageForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nameInput = document.getElementById('name').value.trim();
        const messageInput = document.getElementById('message').value.trim();
        const responseDiv = document.getElementById('responseMessage');

        // إذا ترك الاسم فارغاً يتم إرسال "مجهول"
        const finalName = nameInput !== "" ? nameInput : "مجهول";

        responseDiv.style.color = "#704037";
        responseDiv.innerText = "جاري إرسال رسالتك السرية... 🌸";

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: finalName, message: messageInput })
            });

            const data = await res.json();

            if (res.ok) {
                responseDiv.style.color = "#2e7d32";
                responseDiv.innerText = "✨ " + data.message;
                document.getElementById('messageForm').reset();
            } else {
                responseDiv.style.color = "#c62828";
                responseDiv.innerText = "خطأ: " + data.message;
            }
        } catch (err) {
            responseDiv.style.color = "#c62828";
            responseDiv.innerText = "تعذر الاتصال بالسيرفر! تأكدي أن سيرفر البايثون يعمل.";
        }
    });
</script>

</body>
</html>
